<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%23C13B16'%20stroke-width='2'%20stroke-linecap='round'%3E%3Cpath%20d='M4%206h16M4%2011h10M4%2016h13'/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYPHWARD — Cyber Defense, Layer by Layer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    /* Apply saved theme before first paint (STRATA behavior) */
    try {
      var t = sessionStorage.getItem('cyphward-theme') || localStorage.getItem('cyphward-theme');
      if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
