name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      AUTH_JWT_SECRET: ci-only-test-secret
      GOOGLE_CLIENT_ID: ci-test-client.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: python -m pytest backend/tests -q

  frontend-build:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

  postgres-races:
    name: PostgreSQL admission and execution races
    runs-on: ubuntu-latest
    env:
      CYPHWARD_TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:55432/cyphward_test
      CYPHWARD_TEST_DATABASE_URL: postgresql://cyphward_app@127.0.0.1:55432/cyphward_test
      DATABASE_URL: postgresql://cyphward_app@127.0.0.1:55432/cyphward_test
      AUTH_JWT_SECRET: ephemeral-ci-execution-test-secret-32chars
      CYPHWARD_SCHEDULER_ENABLED: "false"
      CYPHWARD_EXECUTION_RECOVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Start an owned loopback PostgreSQL cluster
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          cyphward_pg_bin=$(dirname "$(ls /usr/lib/postgresql/*/bin/initdb | sort -V | tail -1)")
          echo "CYPHWARD_TEST_PG_BIN=$cyphward_pg_bin" >> "$GITHUB_ENV"
          "$cyphward_pg_bin/initdb" -D "$RUNNER_TEMP/cyphward-postgres" -U postgres --auth=trust
          "$cyphward_pg_bin/pg_ctl" -D "$RUNNER_TEMP/cyphward-postgres" -l "$RUNNER_TEMP/cyphward-postgres.log" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP" -w start
          "$cyphward_pg_bin/createdb" -h 127.0.0.1 -p 55432 -U postgres cyphward_test
      - name: Bootstrap the empty service database
        run: python backend/scripts/bootstrap_test_database.py
      - name: Run independent-connection acceptance tests
        run: python -m pytest backend/tests/test_scan_admission_postgres.py backend/tests/test_scan_execution_postgres.py backend/tests/test_owner_views_postgres.py backend/tests/test_owner_actions_postgres.py -q
      - name: Stop the owned test cluster
        if: always()
        run: |
          if [ -n "$CYPHWARD_TEST_PG_BIN" ] && [ -f "$RUNNER_TEMP/cyphward-postgres/postmaster.pid" ]; then
            "$CYPHWARD_TEST_PG_BIN/pg_ctl" -D "$RUNNER_TEMP/cyphward-postgres" -m fast -w stop
          fi
