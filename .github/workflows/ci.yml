name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      AUTH_JWT_SECRET: ci-only-test-secret
      GOOGLE_CLIENT_ID: ci-test-client.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: python -m pytest backend/tests -q

  frontend-build:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Time-zone helper tests
        run: npm run test:datetime

  postgres-races:
    name: PostgreSQL admission and execution races
    runs-on: ubuntu-latest
    env:
      CYPHWARD_TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:55432/cyphward_test
      CYPHWARD_TEST_DATABASE_URL: postgresql://cyphward_app@127.0.0.1:55432/cyphward_test
      DATABASE_URL: postgresql://cyphward_app@127.0.0.1:55432/cyphward_test
      AUTH_JWT_SECRET: ephemeral-ci-execution-test-secret-32chars
      CYPHWARD_SCHEDULER_ENABLED: "false"
      CYPHWARD_EXECUTION_RECOVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Start an owned loopback PostgreSQL cluster
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          cyphward_pg_bin=$(dirname "$(ls /usr/lib/postgresql/*/bin/initdb | sort -V | tail -1)")
          echo "CYPHWARD_TEST_PG_BIN=$cyphward_pg_bin" >> "$GITHUB_ENV"
          "$cyphward_pg_bin/initdb" -D "$RUNNER_TEMP/cyphward-postgres" -U postgres --auth=trust
          "$cyphward_pg_bin/pg_ctl" -D "$RUNNER_TEMP/cyphward-postgres" -l "$RUNNER_TEMP/cyphward-postgres.log" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP" -w start
          "$cyphward_pg_bin/createdb" -h 127.0.0.1 -p 55432 -U postgres cyphward_test
      - name: Bootstrap the empty service database
        run: python backend/scripts/bootstrap_test_database.py
      - name: Run independent-connection acceptance tests
        run: python -m pytest backend/tests/test_scan_admission_postgres.py backend/tests/test_scan_execution_postgres.py backend/tests/test_owner_views_postgres.py backend/tests/test_owner_actions_postgres.py backend/tests/test_compliance_postgres.py backend/tests/test_third_party_findings_postgres.py backend/tests/test_privacy_stage_postgres.py backend/tests/test_domain_delete_postgres.py backend/tests/test_compliance_attestations_postgres.py backend/tests/test_compliance_incidents_postgres.py backend/tests/test_nuclei_tier_postgres.py backend/tests/test_snapshots_postgres.py backend/tests/test_packs_postgres.py backend/tests/test_compliance_documents_postgres.py backend/tests/test_compliance_evidence_files_postgres.py backend/tests/test_compliance_reviewer_postgres.py backend/tests/test_fintech_demo_seed_postgres.py backend/tests/test_fintech_demo_login_postgres.py backend/tests/test_manual_payment_postgres.py backend/tests/test_browser_jobs_postgres.py backend/tests/test_ai_limits_postgres.py -q
      - name: Stop the owned test cluster
        if: always()
        run: |
          if [ -n "$CYPHWARD_TEST_PG_BIN" ] && [ -f "$RUNNER_TEMP/cyphward-postgres/postmaster.pid" ]; then
            "$CYPHWARD_TEST_PG_BIN/pg_ctl" -D "$RUNNER_TEMP/cyphward-postgres" -m fast -w stop
          fi

  scanner-image:
    name: Scanner worker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the worker image exactly as the VPS deploy does
        run: docker build -f Dockerfile.scanner -t cyphward-scanner:ci .
      - name: Smoke-check the safe-scan policy and tools inside the image
        run: |
          docker run --rm cyphward-scanner:ci python -c "from backend.app.scanner.nuclei_runner import nuclei_policy; p = nuclei_policy(); assert p['available'] and p['remaining_that_submit_credentials_or_forms'] == 0, p; print('policy', p['templates_version'], p['excluded'])"
          docker run --rm cyphward-scanner:ci sh -c "nuclei -version && naabu -version && subfinder -version && httpx -version" 2>&1 | grep -iE "version" | head -8

  browser-worker:
    name: Browser worker fixtures and image
    runs-on: ubuntu-latest
    env:
      AUTH_JWT_SECRET: ci-only-test-secret
      GOOGLE_CLIENT_ID: ci-test-client.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies and a test Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r browser_worker/requirements.txt pytest
          playwright install --with-deps chromium

      - name: Worker logic and localhost fixture sites (no skips allowed)
        run: |
          python -m pytest backend/tests/test_browser_worker_logic.py backend/tests/test_browser_worker_fixtures.py backend/tests/test_browser_evidence_mapping.py -q -rs -p no:cacheprovider | tee browser-tests.txt
          ! grep -q SKIPPED browser-tests.txt

      - name: Build the worker image locally (nothing is pushed or deployed)
        run: docker build -f Dockerfile.browser -t cyphward-browser:ci .

      - name: Smoke-check the image with the production hardening flags
        run: |
          test "$(docker run --rm cyphward-browser:ci id -u)" = "10001"
          docker run --rm cyphward-browser:ci /usr/bin/chromium --version
          # Under Docker's default seccomp profile Chromium's sandbox cannot start, so the sandbox-on smoke run must fail.
          # (This is what the runbook means by "the sandbox needs a host or profile that allows user namespaces".)
          ! docker run --rm --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size 256m --memory 768m \
            --cap-drop ALL --security-opt no-new-privileges:true --init cyphward-browser:ci python -m browser_worker.smoke
          # With the repository's profile the sandbox may start; the runner's own kernel and AppArmor rules decide, so this
          # step reports the result without failing the job. The founder's host check in the runbook is the gate.
          docker run --rm --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size 256m --memory 768m \
            --cap-drop ALL --security-opt no-new-privileges:true --security-opt seccomp="$PWD/browser_worker/deploy/chromium-seccomp.json" \
            --init cyphward-browser:ci python -m browser_worker.smoke || echo "sandbox did not start with the repository profile on this runner"
          # The sandbox is on by default; the CI host's default container profile cannot run it, so this smoke run states --no-sandbox explicitly.
          docker run --rm -e BROWSER_CHROMIUM_SANDBOX=0 --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size 256m --memory 768m --memory-swap 768m \
            --cap-drop ALL --security-opt no-new-privileges:true --init cyphward-browser:ci python -m browser_worker.smoke
          ! docker run --rm cyphward-browser:ci python -m browser_worker
