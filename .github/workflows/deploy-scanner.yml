name: Deploy scanner worker

# CD for the VPS worker (Render/Vercel self-deploy; the VPS does not).
# Runs only when scanner-relevant paths change. Rebuilds the image first
# and restarts only on success, then verifies the worker is polling.
on:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "backend/app/scanner/**"
      - "shared/**"
      - "Dockerfile.scanner"
      - ".github/workflows/deploy-scanner.yml"

concurrency:
  group: scanner-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to scanner VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/cyphward-scanner
            git fetch origin main
            git reset --hard origin/main
            sudo -n docker build -f Dockerfile.scanner -t cyphward-scanner:latest .
            sudo -n systemctl restart cyphward-scanner.service
            sleep 15
            sudo -n systemctl is-active --quiet cyphward-scanner.service
            sudo -n docker ps --format '{{.Names}}' | grep -qx cyphward-scanner
            sudo -n docker logs --since 2m cyphward-scanner 2>&1 | grep -q polling
